# Konfigurasi Nginx untuk domain: pdf.uika-bogor.ac.id
# Lokasi file di server: /etc/nginx/sites-enabled/pdf.uika-bogor.ac.id.conf
#
# Perubahan:
# 1. Menambahkan blok `location /uvelocity/` (proxy ke http://127.0.0.1:5050/ dengan WebSocket)
# 2. Menambahkan redirect `location = /uvelocity` ke /uvelocity/
# 3. Tetap mempertahankan semua route yang sudah ada (/api/auth/, /api/, /, certbot SSL)

server {
    server_name pdf.uika-bogor.ac.id;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # =========================================================================
    # UVELOCITY RACING (Game Online 3D - Port 5050)
    # Jalur: https://pdf.uika-bogor.ac.id/uvelocity/
    # =========================================================================
    location /uvelocity/ {
        proxy_pass http://127.0.0.1:5050/;
        proxy_http_version 1.1;

        # Header untuk upgrade WebSocket (Colyseus realtime gameplay)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /uvelocity;

        # Timeout panjang agar koneksi WebSocket balapan tidak putus
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Redirect otomatis jika pengunjung tidak menyertakan slash di akhir
    location = /uvelocity {
        return 301 https://$host/uvelocity/;
    }

    # =========================================================================
    # Service yang sudah ada (TIDAK BERUBAH)
    # =========================================================================
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # radar-be API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # radar-fe (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pdf.uika-bogor.ac.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pdf.uika-bogor.ac.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pdf.uika-bogor.ac.id) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name pdf.uika-bogor.ac.id;
    return 404;
}
