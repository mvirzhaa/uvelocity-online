name: uvelocity
services:
  postgres:
    image: postgres:18.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uvelocity}
      POSTGRES_DB: ${POSTGRES_DB:-uvelocity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
  app:
    build:
      context: .
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/uvelocity/}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-uvelocity}:${POSTGRES_PASSWORD:?Run setup first}@postgres:5432/${POSTGRES_DB:-uvelocity}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-5050}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
volumes:
  postgres_data:
