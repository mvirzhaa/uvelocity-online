name: Deploy UVelocity to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Mengirim source code terbaru ke server via SCP
      - name: Sync repository files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "./*"
          target: "/var/www/uvelocity"
          rm: false

      # Menjalankan build & restart container di server
      - name: Execute deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/uvelocity

            # Buat file .env jika belum ada
            if [ ! -f ".env" ]; then
              echo "==> Inisialisasi .env file dari template..."
              cp .env.example .env
              RANDOM_SECRET=$(openssl rand -hex 16)
              sed -i "s/REPLACE_WITH_A_UNIQUE_RANDOM_PASSWORD/$RANDOM_SECRET/g" .env
              echo "==> File .env berhasil dibuat dengan password unik."
            fi

            echo "==> Menjalankan build dan restart container UVelocity..."
            docker compose down || true
            docker compose up -d --build

            echo "==> Status service saat ini:"
            docker compose ps
            echo "==> UVelocity berhasil dideploy dan berjalan di port 5050 (http://127.0.0.1:5050)!"
