name: Deploy UVelocity to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/var/www/uvelocity"
            REPO_URL="https://github.com/mvirzhaa/uvelocity-online.git"

            echo "==> Memeriksa direktori $APP_DIR..."
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> Cloning repository publik..."
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "==> Menarik pembaruan terbaru dari GitHub..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            # Inisialisasi .env jika belum ada
            if [ ! -f ".env" ]; then
              echo "==> Membuat konfigurasi .env dari template..."
              cp .env.example .env
              RANDOM_SECRET=$(openssl rand -hex 16)
              sed -i "s/REPLACE_WITH_A_UNIQUE_RANDOM_PASSWORD/$RANDOM_SECRET/g" .env
              echo "==> File .env berhasil disiapkan dengan secret unik."
            fi

            echo "==> Menjalankan build & restart container UVelocity..."
            docker compose down || true
            docker compose up -d --build

            echo "==> Status container saat ini:"
            docker compose ps
            echo "==> Deployment berhasil! UVelocity berjalan di port 5050."
